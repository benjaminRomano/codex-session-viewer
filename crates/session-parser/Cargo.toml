[package]
name = "session-parser"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Streaming, local-only Codex JSONL trace parser for native and WebAssembly"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
wasm-bindgen = "=0.2.100"
memchr = "2"

[[bench]]
name = "loading"
harness = false
